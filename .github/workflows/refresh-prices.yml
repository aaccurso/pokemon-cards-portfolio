name: Refresh prices

# Weekly Cardmarket price refresh. Pushes straight to main: a push made with
# GITHUB_TOKEN does not trigger ci.yml (GitHub blocks recursive workflow
# runs) but does trigger the Vercel deploy, so the tests run here first.
# The script aborts (exit 2, nothing written) when a refresh looks like an
# API accident: any priced card moving more than 5x, or more than 60% of
# cards changing. Rerun locally with --force after looking.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # api.tcgdex.net is GeoDNS: North American clients (GitHub runners) get
      # a node in Canada (142.44.242.175) that lacks the newest sets (every
      # M6a card and the set itself were 404 on 2026-10-30), while European
      # clients get 51.255.35.48 which has everything. Pin the EU node. If it
      # ever moves, the skip guardrail turns this run red rather than
      # committing a partial refresh.
      - name: Pin api.tcgdex.net to the EU node
        run: echo "51.255.35.48 api.tcgdex.net" | sudo tee -a /etc/hosts

      - name: Refresh prices from tcgdex
        run: node scripts/refresh_prices.mjs --summary .refresh-summary.md

      - name: Validate the refreshed data
        run: npm test

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cards.json data/prices.json data/meta.json
          if git diff --cached --quiet; then
            echo "No price changes to commit."
            exit 0
          fi
          git commit --no-verify -F .refresh-summary.md
          git pull --rebase origin main
          git push origin HEAD:main
