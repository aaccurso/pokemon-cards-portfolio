name: Refresh prices

# Weekly Cardmarket price refresh. Pushes straight to main: a push made with
# GITHUB_TOKEN does not trigger ci.yml (GitHub blocks recursive workflow
# runs) but does trigger the Vercel deploy, so the tests run here first.
# The script aborts (exit 2, nothing written) when a refresh looks like an
# API accident: any priced card moving more than 5x, or more than 60% of
# cards changing. Rerun locally with --force after looking.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Refresh prices from tcgdex
        run: node scripts/refresh_prices.mjs --summary .refresh-summary.md

      - name: Validate the refreshed data
        run: npm test

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cards.json data/prices.json data/meta.json
          if git diff --cached --quiet; then
            echo "No price changes to commit."
            exit 0
          fi
          git commit --no-verify -F .refresh-summary.md
          git pull --rebase origin main
          git push origin HEAD:main
