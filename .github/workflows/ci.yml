name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Smoke (headless Chrome DOM checks)
        run: npm run smoke -- --require-chrome
